
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Starbucks|Sign In</title>

    <link rel="stylesheet" href="signin.css">
</head>

<body>

    <!-- Header Section -->
    <header>
        <div class="logo">
            <img src="Starbucks_Corporation_Logo_2011.svg.webp">
            alt="Starbucks Logo">
        </div>
    </header>

    <!-- Main Background -->
    <section class="login-section">

        <!-- Login Form Box -->
        <div class="login-box">

            <h1>Welcome back!</h1>

            <form>

                <!-- Email Input -->
                <div class="input-group email-group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" required>
                </div>
                <br><br><br>
                <!-- Password Input -->
                <div class="input-group password-group">
                    <input type="password" id="password"
                        placeholder="Password" required>
                </div>

                <!-- Remember Me and Forgot Password -->
                <div class="options">

                    <div class="remember">
                        <input type="checkbox" id="remember" checked>
                        <label for="remember">Keep me signed in.</label>
                        <a href="#" onclick="showmsg()">Details</a>
                        <script>
                            function showmsg(){
                                alert("Checking this box will reduce the number of times you're asked to sign in. To keep your account secure, use this option only on your personal devices.")
                            }
                                </script>
                    </div>

                    <a href="/Forget/forget.html" class="forgot">Forgot your password?</a>

                </div>

                <!-- Sign In Button -->
                <div class="button-section">
                    <button type="submit">Sign in</button>
                </div>

                <!-- Join Now Link -->
                <p class="join-text">
                    Don't have an account?
                    <a href="/join/join.html">Join now</a>
                </p>
                
            </form>

        </div>

    </section>

</body>
</html>
