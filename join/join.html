<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starbucks|Join Now</title>
    <link rel="stylesheet" href="join.css">
</head>

<body>

    <header>

        <!-- Displays the cafe logo -->
        <div class="logo">
            <img src="https://static.vecteezy.com/system/resources/previews/022/636/379/non_2x/starbucks-logo-starbucks-icon-transparent-free-png.png" alt="Cafe Capital Logo">
        </div>
        </header>
    <div class="join">

        <div class="form">

            <h1>Create an account</h1>

            <h3>Personal info</h3>

            <input type="text" placeholder="First name" required>

            <input type="text" placeholder="Last name" required>

            <h3>Security</h3>

            <input type="email" placeholder="Email address" required>

            <input type="password" placeholder="Password" required>

            <label class="check">
                <input type="checkbox">
                Get emails from Starbucks (optional)
            </label>

            <p class="small">
                Know about products, offers, announcements and initiatives.
            </p>

            <label class="check">
                <input type="checkbox">
                I accept the Terms of use
            </label>


            <button>Create account</button>
            <p class="small" style="text-align: center; font-size: 16px; font-family: Arial, Helvetica, sans-serif;">
                Already have an account?
                <a href="/sign/signin.html" style="color: rgb(43,93,43); font-size: 18px; font-weight: bold; text-decoration: none;">
                    Sign in</a>
            </p>
        </div>

    </div>

</body>
</html>
